name: Check used racquets

on:
  schedule:
    # Six times a day, every 3 hours from 6am to 9pm Pacific -- nothing
    # overnight. Cron is always UTC and has no notion of DST, so these are
    # Pacific Daylight (UTC-7); from November to March they land an hour
    # earlier, 5am-8pm. Close enough not to chase.
    #   13:00 UTC = 6am    22:00 UTC = 3pm
    #   16:00 UTC = 9am    01:00 UTC = 6pm
    #   19:00 UTC = 12pm   04:00 UTC = 9pm
    - cron: "0 13,16,19,22,1,4 * * *"
  workflow_dispatch:        # the "Run workflow" button -- replaces the Shortcut

# Least privilege: write the data files back, and publish the report to Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs race on the same commit history.
concurrency:
  group: check-racquets
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # No setup-python and no pip install: the runner already ships a python3
      # and tw_used.py is pure standard library. Skipping the action saves a
      # couple of seconds on every run.

      - name: Scrape Tennis Warehouse and rebuild the report
        # Runners are UTC; without this the report is stamped in UTC and the
        # "as of" time reads hours off.
        env:
          TZ: America/Los_Angeles
        # --no-push because the commit step below does it; --no-sync because
        # checkout already put us on the latest commit.
        run: python3 tw_used.py --no-sync --no-push --html-mode pages

      - name: Commit price history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add used_prices.csv history.csv seen.json snapshot.json thumbs thumbs_large
          # Nothing changed on a quiet run -- that is a success, not a failure.
          if git diff --cached --quiet; then
            echo "No price changes this run."
          else
            git commit -m "Prices as of $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Another run may have pushed while we were scraping.
            git pull --rebase --autostash
            git push
          fi

      - name: Assemble the Pages site
        run: |
          mkdir -p site
          # report.html links the lightbox images by relative path, so
          # thumbs_large has to ship alongside it.
          cp report.html site/index.html
          cp -r thumbs_large site/thumbs_large

      # Pages is already enabled on the repo with build_type=workflow, so this
      # just reads that config. Don't add `enablement: true` -- it needs an
      # admin token the workflow's GITHUB_TOKEN doesn't have.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
