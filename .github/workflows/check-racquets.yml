name: Check used racquets

on:
  schedule:
    # Six times a day, every 3 hours from 6am to 9pm Pacific -- nothing
    # overnight. Cron is always UTC and has no notion of DST, so these are
    # Pacific Daylight (UTC-7); from November to March they land an hour
    # earlier, 5am-8pm. Close enough not to chase.
    # At :17 past, not :00 -- GitHub delays or drops top-of-the-hour crons
    # under load, and only ~4 of 6 were landing.
    #   13:17 UTC = 6:17am    22:17 UTC = 3:17pm
    #   16:17 UTC = 9:17am    01:17 UTC = 6:17pm
    #   19:17 UTC = 12:17pm   04:17 UTC = 9:17pm
    - cron: "17 13,16,19,22,1,4 * * *"
  workflow_dispatch:        # the "Run workflow" button

  # A scrape on the Mac pushes its results here; republish them so the phone
  # doesn't sit on older prices than the laptop. This does NOT scrape again --
  # the data just arrived. Pushes made by this workflow's own GITHUB_TOKEN
  # don't start another run, so there's no loop.
  push:
    branches: [main]
    paths:
      - snapshot.json       # a scrape landed
      - report.py           # or the report itself changed
      - tw_used.py

# Least privilege: write the data files back, and publish the report to Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs race on the same commit history.
concurrency:
  group: check-racquets
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # No setup-python and no pip install: the runner already ships a python3
      # and tw_used.py is pure standard library. Skipping the action saves a
      # couple of seconds on every run.

      - name: Build the report
        # Runners are UTC; without this the report is stamped in UTC and the
        # "as of" time reads hours off.
        env:
          TZ: America/Los_Angeles
          # On a push the data came from the Mac seconds ago -- rebuild from it
          # rather than scraping Tennis Warehouse again for no reason.
          FROM_PUSH: ${{ github.event_name == 'push' }}
        # --no-push because the commit step below does it; --no-sync because
        # checkout already put us on the latest commit.
        run: |
          [ "$FROM_PUSH" = true ] && PULL=--pull || PULL=
          python3 tw_used.py $PULL --no-sync --no-push --html-mode pages

      - name: Commit price history
        # A push-triggered run scrapes nothing, so there is never anything new
        # to record -- the data is what the Mac just pushed.
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add used_prices.csv history.csv seen.json snapshot.json thumbs thumbs_large
          # Nothing changed on a quiet run -- that is a success, not a failure.
          if git diff --cached --quiet; then
            echo "No price changes this run."
          else
            git commit -m "Prices as of $(date -u '+%Y-%m-%d %H:%M UTC')"
            # The Mac may have pushed while we were scraping. history.csv
            # union-merges; the derived files conflict, and this scrape is the
            # newer one. During a rebase "--theirs" is the commit being
            # replayed -- ours, from this run.
            if ! git pull --rebase; then
              git checkout --theirs -- used_prices.csv seen.json snapshot.json
              git add used_prices.csv seen.json snapshot.json
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
            fi
            # A union merge can leave repeated rows; collapse them.
            python3 -c "import tw_used; tw_used.dedupe_history()"
            if ! git diff --quiet history.csv; then
              git commit -q --amend --no-edit -- history.csv
            fi
            git push
          fi

      - name: Assemble the Pages site
        # --html-mode pages already wrote site/index.html. Only the lightbox
        # images are missing: the page links them by relative path, so
        # thumbs_large has to ship alongside it.
        run: cp -r thumbs_large site/thumbs_large

      # Pages is already enabled on the repo with build_type=workflow, so this
      # just reads that config. Don't add `enablement: true` -- it needs an
      # admin token the workflow's GITHUB_TOKEN doesn't have.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
